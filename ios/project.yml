name: ChipID
options:
  bundleIdPrefix: com.ismoilovdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ChipCore:
    path: ChipCore
  NFCPassportReader:
    path: Vendor/NFCPassportReader
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChipID:
    type: application
    platform: iOS
    sources:
      - path: ChipID
        excludes:
          - "Resources/masterlist.ml"
      - path: ChipID/Resources/masterlist.ml
        optional: true
        buildPhase: resources
    dependencies:
      - package: ChipCore
      - package: NFCPassportReader
    preBuildScripts:
      - name: Fetch CSCA master list
        script: "\"${SRCROOT}/scripts/fetch-masterlist.sh\""
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismoilovdev.chipid
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: ChipID/ChipID.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChipID/Info.plist
    info:
      path: ChipID/Info.plist
      properties:
        CFBundleDisplayName: ChipID
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Inter.ttf, JetBrainsMono.ttf]
        NFCReaderUsageDescription: ChipID reads the chip in your passport or ID card to check that the document is genuine.
        NSCameraUsageDescription: ChipID reads the machine readable zone (MRZ) on your document. Frames are recognised on the phone and never saved or sent.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A0000002471001
          - A0000002472001
          - "00000000000000"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    entitlements:
      path: ChipID/ChipID.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
